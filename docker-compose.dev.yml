name: unstakd-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: unstakd
      POSTGRES_PASSWORD: unstakd
      POSTGRES_DB: unstakd
    ports: ["127.0.0.1:5434:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unstakd"]
      interval: 2s
      retries: 20

  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  # Reverse proxy for deployed apps: http://<app>.localhost:8080
  caddy:
    image: caddy:2-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/dev.json", "--resume"]
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:2019:2019"
    volumes: [caddydata:/data, caddyconfig:/config, ./docker/caddy/dev.json:/etc/caddy/dev.json:ro]
    networks: [default, unstakd]

  # Builder for Railpack (repos without a Dockerfile)
  buildkit:
    image: moby/buildkit:v0.23.2
    privileged: true
    command: ["--addr", "tcp://0.0.0.0:1234"]
    ports: ["127.0.0.1:1234:1234"]
    volumes: [buildkit:/var/lib/buildkit]

networks:
  unstakd:
    external: true

volumes:
  pgdata:
  caddydata:
  caddyconfig:
  buildkit:
