name: unstakd-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: unstakd
      POSTGRES_PASSWORD: unstakd
      POSTGRES_DB: unstakd
    ports: ["127.0.0.1:5434:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unstakd"]
      interval: 2s
      retries: 20

  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
